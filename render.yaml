services:
  - type: web
    name: alertbridge-backend
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: ALERTBRIDGE_HOST
        value: 127.0.0.1
      - key: ALERTBRIDGE_PORT
        value: "5000"
      - key: PYTHON_HOST
        value: 127.0.0.1
      - key: PYTHON_PORT
        value: "5000"
      - key: ALLOWED_ORIGIN
        value: https://alert-bridge-sage.vercel.app
